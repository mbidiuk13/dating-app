spring.application.name=dating-app

# Локальні налаштування (пароль до БД) зберігаються в application-local.properties,
# який НЕ потрапляє в Git (див. .gitignore). Шаблон: application-local.properties.example
spring.config.import=optional:classpath:application-local.properties

# ---------- PostgreSQL ----------
spring.datasource.url=jdbc:postgresql://localhost:5432/dating_app
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:}

# ---------- JPA / Hibernate ----------
# Таблиці та індекси створюються й оновлюються за JPA-сутностями
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
# Пов'язані дані (теги, користувачі) завантажуються пачками по 50, а не окремим запитом на кожну анкету
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ---------- HTTPS (НФВ безпеки) ----------
# Основний порт — HTTPS. Сертифікат створюється командою keytool (див. README, розділ «Запуск»).
server.port=8443
server.ssl.enabled=${SSL_ENABLED:true}
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=dating-app
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:changeit}
# HTTP-порт лише перенаправляє на HTTPS (config/HttpsConfig)
app.http-port=8080

# Cookie сесії: недоступна для JavaScript і передається лише по HTTPS
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${server.ssl.enabled:true}
server.servlet.session.timeout=30m

# ---------- Безпечні повідомлення про помилки (НФВ надійності) ----------
# Користувач бачить лише templates/error.html, без stack trace і тексту винятків
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never

# ---------- Журнал HTTP-запитів (НФВ безпеки: журналювання доступу) ----------
# logs/access.YYYY-MM-DD.log: час, IP, запит, код відповіді, тривалість у мс
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=${user.dir}/logs
server.tomcat.accesslog.prefix=access
server.tomcat.accesslog.suffix=.log
server.tomcat.accesslog.pattern=%t %a "%r" %s %{ms}T ms
server.tomcat.accesslog.encoding=UTF-8

# ---------- Моніторинг доступності (НФВ надійності) ----------
# https://localhost:8443/actuator/health відповідає {"status":"UP"}, коли застосунок і БД працюють
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
