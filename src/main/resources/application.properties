spring.application.name=dating-app

# Локальні налаштування (пароль до БД) зберігаються в application-local.properties,
# який НЕ потрапляє в Git (див. .gitignore). Шаблон: application-local.properties.example
spring.config.import=optional:classpath:application-local.properties

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/dating_app
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate: таблиці створюються та оновлюються за JPA-сутностями
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
