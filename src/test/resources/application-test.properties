# Профіль для інтеграційних тестів: вбудована БД H2 у режимі PostgreSQL.
# Таблиці створюються з JPA-сутностей перед тестами і видаляються після них,
# тому тести не потребують встановленого PostgreSQL і не змінюють робочу базу.
spring.datasource.url=jdbc:h2:mem:dating_app_test_${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Тести працюють без справжнього вебсервера (MockMvc), тому HTTPS і сертифікат не потрібні
server.ssl.enabled=false
